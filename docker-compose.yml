# ============================================================================
# docker-compose.yml —— 把「别裸暴露公网」翻译成具体参数
#
# 这一份的责任不是「让容器跑起来」（Dockerfile 就够了），而是把沙箱里
# 已经做过的那件事，在容器这一层再做一遍，并且两层的数字对得上：
#
#   沙箱层（进程内）              容器层（cgroup / namespace）
#   ────────────────────────     ──────────────────────────────
#   单次 256MB 内存配额      →    mem_limit 1g（3 并发 × 256MB + 解释器）
#   单次禁止创建子进程       →    pids_limit（整机兜底，见下）
#   CPU 时间 5.5s 上限       →    cpus 2.0（同样的墙钟，防的是另一个问题）
#   只写工作目录             →    read_only + 只给 /tmp 一块 tmpfs
#   seccomp 掐掉 socket      →    不需要额外做什么（见文末说明）
#
# 为什么两层都要：沙箱管的是**一个用户程序**能用多少；容器管的是
# **这个服务**能用多少。前者是坏的代码写了个 malloc(1<<30)，
# 后者是坏的代码被提交了 200 次。两种事都得挡住，而且挡的方法不一样。
# ============================================================================
name: cmaster

services:
  cmaster:
    build:
      context: .
    image: cmaster:local
    container_name: cmaster
    restart: unless-stopped

    # ------------------------------------------------------------------
    # 只绑回环地址。
    #
    # 这一行就是 README 里那句「别裸暴露公网」的落地形式：默认情况下
    # 外面根本连不上，想让人访问必须自己改这里（或者前面挂一个
    # 带 TLS、带限流、带鉴权的反向代理）。
    #
    # 写成 "5001:5001" 是把「能不能被公网访问」交给宿主机防火墙，
    # 而防火墙规则是最容易被一句 `ufw disable` 忘掉的东西；
    # 写成 127.0.0.1 则是把它交给「你不动这行就不会发生」。
    # ------------------------------------------------------------------
    ports:
      - "127.0.0.1:5001:5001"

    environment:
      CMASTER_PORT: "5001"
      # 并发闸门：和沙箱的单次配额相乘就是容器的内存下限（见 mem_limit）。
      CMASTER_CONCURRENCY: "3"
      # 不设 CMASTER_SANDBOX=0。那个开关是给本机调试用的，
      # 在容器里关掉沙箱等于把这一整套防护一次性拆掉。
      #
      # session 密钥：从 .env 读（CMASTER_SECRET=...）。没有的话
      # app.py 会自己生成一个落进 data/.secret，卷是持久的，重启不会
      # 把所有人踢下线——但同一个镜像部署多份时各自不同，这是对的。
      CMASTER_SECRET: "${CMASTER_SECRET:-}"

    volumes:
      # 只持久化 data/。代码在镜像里，不在卷里——
      # 「配置和代码进镜像、状态进卷」是最省心的分层：
      # 升级就是换个镜像，数据一行没动。
      - cmaster-data:/app/data

    # ------------------------------------------------------------------
    # 根文件系统只读。
    #
    # 用户代码在沙箱里跑，理论上碰不到 /app；但「理论上」是沙箱的承诺，
    # 不是容器的承诺。根只读之后，即使沙箱被绕过，能改的东西也只有
    # /tmp 和卷——改不了 app.py、改不了题库、也留不下后门。
    #
    # 代价：必须有可写的临时目录，而且**不能加 noexec**。
    # noexec 是常见的加固项，但这里加了会直接把判题打死：judge.py
    # 把用户代码编译到 /tmp/<随机>/main，然后 exec 它；noexec 会让
    # 那次 exec 返回 EACCES，表现为「所有题都 RE」。
    # 加固措施不是越严越好，是限在「不影响功能」的那条线上。
    # ------------------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m,mode=1777

    # 丢掉所有 capability。这个服务不需要 bind 1024 以下端口、
    # 不需要改系统时间、不需要 NET_RAW——一个都不需要。
    cap_drop:
      - ALL

    security_opt:
      # 禁止通过 setuid 二进制提权。和 runner_linux.c 里的
      # PR_SET_NO_NEW_PRIVS 是同一条内核开关的两种写法，
      # 一个作用在容器 init，一个作用在子进程。
      - no-new-privileges:true

    # ------------------------------------------------------------------
    # 资源上限。数字不是拍出来的，是从沙箱的配额推出来的：
    #   3 并发 × 256MB 单次配额 = 768MB，再留 ~250MB 给 Python 自己、
    #   模板缓存和 tmpfs 里的判题工作目录。给 1g 是留了余量但不是浪费。
    # mem_limit 与 memswap_limit 相等 = 不给 swap：swap 会让
    # 「内存超了」从「立刻失败」变成「卡住十分钟」，判题场景里前者更好。
    # ------------------------------------------------------------------
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0

    # pids_limit 数的是**线程**，不只是进程。Python 的 gcc 子进程、
    # 判题线程、Flask 的连接线程都要算进去，所以不能照着
    # 「3 并发」写成 3。256 是这个服务正常水位（实测十几）的十几倍，
    # 真正的 fork 炸弹已经被沙箱的 ActiveProcessLimit / RLIMIT_NPROC
    # 挡在更里面一层，这里是整机兜底。
    pids_limit: 256

    # 文件描述符：每个判题要开 stdin/stdout/stderr 三个管道 ×3 并发，
    # 加上 Flask 的连接。默认 1024 够用，但显式写出来省得以后排查
    # 「too many open files」时还要猜。
    ulimits:
      nofile:
        soft: 1024
        hard: 4096

    # 容器停下时给 15 秒：正在判的题最长 3s（墙钟上限）+ 编译 20s 不是
    # 每次都撞上，15s 足够把手里这一题判完再走。直接 -t 1 会让
    # 「提交了但没结果」变成常态。
    stop_grace_period: 15s

    # ------------------------------------------------------------------
    # 日志轮转。默认的 json-file driver 不限额，一个跑三个月的容器
    # 能把宿主磁盘写满——而磁盘满之后 SQLite/JSON 写入失败的表现是
    # 乱码不是报错，最难查。10MB × 3 个文件，够看，封顶。
    # ------------------------------------------------------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # 和 Dockerfile 里的保持一致（这里显式写出来是为了让人在
      # docker compose config 里就能看到，不用回去翻 Dockerfile）。
      # 只查 /healthz：存活探针。就绪状态看 /readyz，别混。
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  cmaster-data:
    # 具名卷，不是 bind mount：代码仓库里的 data/ 和运行中的数据必须
    # 分开，否则「本地跑过一次」会污染镜像的构建上下文。
    # 备份方式：docker run --rm -v cmaster_cmaster-data:/d -v $PWD:/b alpine \
    #             tar czf /b/data-backup.tgz -C /d .
