name: Online deployment verification
on:
  push:
    branches: [main, codex/online-deployment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_HOST: learn.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit regressions
        run: |
          python -m pip install -r deploy/requirements.txt
          python -m unittest discover -s tests -v
      - name: Validate Compose and build all production images
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.yml --profile build build
          docker compose -f deploy/compose.yml run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Real GCC verdicts and container isolation
        run: python -m deploy.smoke
      - name: Registration and persistent learning records
        run: |
          docker compose -f deploy/compose.yml -f deploy/compose.test.yml up -d web broker
          python -m deploy.smoke_web create
          docker compose -f deploy/compose.yml -f deploy/compose.test.yml up -d --force-recreate web broker
          python -m deploy.smoke_web verify
      - name: Diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail=100 web broker
      - name: Remove disposable CI data
        if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml down -v --remove-orphans
